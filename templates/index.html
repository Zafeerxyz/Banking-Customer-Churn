
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Churn Prediction</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container py-5">
    <div class="text-center mb-5">
        <h1>Customer Churn Prediction</h1>
        <p class="text-muted">
            Enter customer details to predict the probability of churn.
        </p>
    </div>

    <div class="card shadow-sm mx-auto form-card">
        <div class="card-body p-4">

            <form action="/predict" method="POST">

                <h5 class="mb-3">Customer Information</h5>

                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label">Credit Score</label>
                        <input type="number" name="CreditScore"
                               class="form-control" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Age</label>
                        <input type="number" name="Age"
                               class="form-control" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Geography</label>
                        <select name="Geography" class="form-select" required>
                            <option value="">Select Geography</option>
                            <option>France</option>
                            <option>Germany</option>
                            <option>Spain</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Gender</label>
                        <select name="Gender" class="form-select" required>
                            <option value="">Select Gender</option>
                            <option>Male</option>
                            <option>Female</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Tenure</label>
                        <input type="number" name="Tenure"
                               class="form-control" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Balance</label>
                        <input type="number" step="any" name="Balance"
                               class="form-control" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Number of Products</label>
                        <input type="number" name="NumOfProducts"
                               class="form-control" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Estimated Salary</label>
                        <input type="number" step="any" name="EstimatedSalary"
                               class="form-control" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Satisfaction Score</label>
                        <input type="number" name="Satisfaction_Score"
                               class="form-control" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Point Earned</label>
                        <input type="number" name="Point_Earned"
                               class="form-control" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Card Type</label>
                        <select name="Card_Type" class="form-select" required>
                            <option value="">Select Card Type</option>
                            <option>Silver</option>
                            <option>Gold</option>
                            <option>Platinum</option>
                            <option>DIAMOND</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Has Credit Card?</label>
                        <select name="HasCrCard" class="form-select" required>
                            <option value="1">Yes</option>
                            <option value="0">No</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Active Member?</label>
                        <select name="IsActiveMember" class="form-select" required>
                            <option value="1">Yes</option>
                            <option value="0">No</option>
                        </select>
                    </div>

                </div>

                <button type="submit" class="btn btn-primary w-100 mt-4">
                    Predict Customer Churn
                </button>

            </form>
            
            {% if prediction %}
            <hr class="my-4">

            <div class="alert {{ 'alert-danger' if prediction == 'Likely to churn' else 'alert-success' }}">
                <h4 class="alert-heading">Prediction Result</h4>

                <p class="mb-2">
                    <strong>Result:</strong> {{ prediction }}
                </p>

                <p class="mb-2">
                    <strong>Churn Probability:</strong> {{ churn_probability }}
                </p>

                <p class="mb-0">
                    <strong>Decision Threshold:</strong> {{ threshold }}
                </p>
            </div>
            {% endif %}


        </div>
    </div>
</div>

</body>
</html>
